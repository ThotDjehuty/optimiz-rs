name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-openblas
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin==1.15.0 pytest pytest-cov numpy
      
      - name: Build Rust extension
        run: |
          maturin build --release --out dist/

      - name: Repair Windows wheel dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install delvewheel==1.9.0
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel found in dist" }
          delvewheel repair --add-path "$env:VCPKG_ROOT\installed\x64-windows\bin" --wheel-dir dist\repaired $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $wheel.FullName
          Move-Item dist\repaired\*.whl dist\
          Remove-Item dist\repaired -Recurse -Force

      - name: Install Rust extension
        run: |
          pip install --no-index --find-links dist optimiz-rs
      
      - name: Run tests
        run: python -m pytest tests/test_optimizr.py tests/test_v2_api.py -v --cov=optimizr --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff "mypy>=1.0,<1.15"
      
      - name: Check formatting with black
        run: black --check python/
      
      - name: Lint with ruff
        run: ruff check python/
      
      - name: Type check with mypy
        run: mypy python/optimizr/ --ignore-missing-imports
  
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-openblas
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      
      - name: Install maturin
        run: pip install maturin==1.15.0
      
      - name: Build wheels
        run: maturin build --release --out dist/

      - name: Repair Windows wheel dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install delvewheel==1.9.0
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel found in dist" }
          delvewheel repair --add-path "$env:VCPKG_ROOT\installed\x64-windows\bin" --wheel-dir dist\repaired $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $wheel.FullName
          Move-Item dist\repaired\*.whl dist\
          Remove-Item dist\repaired -Recurse -Force

      - name: Test built wheel
        run: |
          python -m pip install numpy pytest
          python -m pip install --no-index --find-links dist optimiz-rs
          python -m pytest tests/test_optimizr.py tests/test_v2_api.py -q
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/
